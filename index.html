<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="index.css">
  
  
</head>
<body>

  <main>
    <div class="card-container">
      <div class="card">
        <div class="card-image">
          <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT image" class="nft-img"/>
          <div class="overlay">
            <img src="images/icon-view.svg" alt="View icon" class="view-icon" />
          </div>
        </div>
        
        
        <h1 class="card-title"><a href="#">  Equilibrium #3429 </a></h1>
        <div class="card-description">Our Equilibrium collection promotes balance and calm.</div>

        <div class="card-text">
          <div class="item-left">
            <div class="left-image">
              <img src="images/icon-ethereum.svg" alt="ethereum icon"/> 
            </div>
            <div class="left-text">0.041 ETH</div>
          </div>
          
          <div class="item-right">
            <div class="right-image"><img src="images/icon-clock.svg" alt="clock icon"/></div>
            <div class="right-text">3 days left</div>
          </div>
        </div>

        <div class="footer">
          <div class="profile-image">
            <img src="images/image-avatar.png" alt="avatar"/>
          </div>
          <div class="username">Creation of <a href="#"> Jules Wyvern </a></div>
        </div>
      </div>

      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="#">Shubhangi Mishra</a>.
      </div>
    </div>

  </main>  
  
  
    
  
</body>
</html>
